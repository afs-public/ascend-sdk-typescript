name: Publish TS SDK

on:
  push:
    branches:
      - fix/publish-workflow

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and publish to npm
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192" # 8GB memory limit
          npm install && npm publish --access public
